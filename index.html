<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Confirm Email Change</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#fff;">
  <div style="max-width:560px;margin:48px auto;padding:24px;">
    <h1 style="margin:0 0 8px 0;">📧 Confirm email change</h1>
    <p id="status" style="color:#444;margin:0 0 18px 0;">Checking link…</p>

    <div id="done" style="display:none;">
      <p style="color:#137333;font-weight:600;">
        ✅ Your email address has been updated.
      </p>

      <p style="margin-top:12px;">
        You can now return to the app and log in.
      </p>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ⚠️ FILL THESE
    const SUPABASE_URL = "https://cgchcwqtevbybjxibamz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnY2hjd3F0ZXZieWJqeGliYW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyMzY4ODksImV4cCI6MjA3NjgxMjg4OX0.2s1i2-cWPsjdnxcK0eijKJESp-AY08MNSWRIQSeLwKs";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const qs = new URLSearchParams(window.location.search);
    const token_hash = qs.get("token_hash");
    const type = qs.get("type");

    const statusEl = document.getElementById("status");
    const doneEl = document.getElementById("done");

    function fail(msg) {
      statusEl.textContent = msg;
      statusEl.style.color = "#b00020";
    }

    function ok(msg) {
      statusEl.textContent = msg;
      statusEl.style.color = "#137333";
      doneEl.style.display = "block";
    }

    // Verify email change
    if (type !== "email_change" || !token_hash) {
      fail("Invalid or missing link. Please request email change again.");
    } else {
      const { error } = await supabase.auth.verifyOtp({
        type: "email_change",
        token_hash
      });

      if (error) {
        console.error(error);
        fail("Link expired or invalid. Please try again.");
      } else {
        ok("Email verified successfully.");
      }
    }
  </script>
</body>
</html>
